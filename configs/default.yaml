# Default Pipeline Configuration for Amazon ML Challenge 2026
# Business Entity Resolution Engine

experiment:
  id: "EXP000"
  name: "baseline_scaffold"
  seed: 42
  description: "Phase 0 foundational baseline configuration"

paths:
  raw_train_dir: "data/raw/train"
  raw_test_dir: "data/raw/test"
  sample_dir: "data/samples"
  output_dir: "output"
  artifacts_dir: "artifacts"
  experiments_log: "experiments/experiment_log.csv"
  matching_results_path: "output/matching_results.tsv"
  candidate_pairs_path: "output/candidate_pairs.tsv"

data:
  train_source1: "data/raw/train/train_source1.tsv"
  train_source2: "data/raw/train/train_source2.tsv"
  train_source3: "data/raw/train/train_source3.tsv"
  train_ground_truth: "data/raw/train/train_ground_truth.tsv"
  test_source1: "data/raw/test/test_source1.tsv"
  test_source2: "data/raw/test/test_source2.tsv"
  test_source3: "data/raw/test/test_source3.tsv"

normalization:
  lowercase: true
  strip_accents: true
  normalize_whitespace: true
  legal_suffix_norm: true
  address_abbrev_norm: true

blocking:
  exact_name: true
  exact_address: true
  exact_name_address: true
  char_ngram:
    enabled: true
    n: 3
    threshold: 0.7
  tfidf:
    enabled: true
    max_features: 50000
    top_k: 10
  phonetic:
    enabled: false
  numeric_anchors:
    enabled: true

features:
  name_metrics:
    - "exact"
    - "token_jaccard"
    - "edit_similarity"
  address_metrics:
    - "exact"
    - "token_jaccard"
    - "numeric_overlap"
  interaction:
    enabled: true
  retrieval_metadata:
    enabled: true

model:
  algorithm: "xgboost"
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  random_state: 42

decision:
  default_threshold: 0.50
  margin_threshold: 0.05
  allow_empty_matches: true
  max_matches_per_entity: 15

resources:
  n_jobs: -1
  chunk_size: 100000
  memory_limit_gb: 16
